[package]
name = "lease-sequencer"
version = "0.1.0"
edition = "2024"
rust-version = "1.96" # uvrr-core 0.11.0's floor; let-chains in src/main.rs are older news

# The test target: the integration tests link the pure modules
# (timeouts, bridge, telemetry, embedded_client) through this thin lib
# facade over the binary, and the lib's own unit tests (client_gate,
# embedded_client) run under `cargo test` too.
[lib]
name = "lease_sequencer"
path = "src/lib.rs"

[dependencies]
lunet-advisory-lock = { path = "../../ext/advisory_lock" }
# The vendored TigerBeetle AOF: the standby's commit/heartbeat
# stream rides the real TB-format write-behind log through its Zig C ABI.
lunet-locks-aof = { path = "../../ext/lunet-locks-aof" }
# The bridge decodes Wire records through the core's own
# `Message::unpack_from`; the [patch] below resolves it to the submodule.
vrr = { package = "uvrr-core", git = "https://github.com/lua-lunet/uvrr-core.git", tag = "v0.11.0" }
serde_json = "1"
# The run-state snapshot archives (the snapshot rule): the check tool
# reads `snapshot_run.lua`'s gzip tars transparently next to raw run dirs.
tar = "0.4"
flate2 = "1"
signal-hook = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
# `json`: the observability contract's line shape — one JSON object per
# line, the event's fields flattened into the root object.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
# The Flight Recorder passthrough: the rig binary with the per-node
# internal trace compiled in (the run's swap-in build —
# `cargo build --release --features flight-recorder`). The recorded
# nodes opt in per node via `LUNET_FLIGHT_RECORDER_DIR`.
flight-recorder = ["lunet-advisory-lock/flight-recorder"]

# The [patch] section is honored only in a workspace root's manifest — a
# dependency's own [patch] is ignored — so the consumer restates it here.
# It resolves the tagged dependency to the vendored submodule copy
# (ext/uvrr-core, checked out at bef2d42 = upstream tag v0.11.0), so every
# build lane — including Docker with no network fetch — builds against
# content byte-identical to the released tag. The dependency alias stays
# `vrr`: the local binding name, so the source keeps its `use vrr::` paths.
[patch."https://github.com/lua-lunet/uvrr-core.git"]
uvrr-core = { path = "../../ext/uvrr-core" }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
