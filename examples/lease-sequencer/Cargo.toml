[package]
name = "lease-sequencer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
lunet-advisory-lock = { path = "../../ext/advisory_lock" }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
