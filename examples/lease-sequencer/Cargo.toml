[package]
name = "lease-sequencer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88" # let-chains in src/main.rs; the shipped adapter crate stays at its 1.85 floor

# The test target: the integration tests link the pure modules (phi,
# bridge, telemetry, embedded_client) through this thin lib facade over
# the binary, and the lib's own unit tests (client_gate, embedded_client)
# run under `cargo test` too.
[lib]
name = "lease_sequencer"
path = "src/lib.rs"

[dependencies]
lunet-advisory-lock = { path = "../../ext/advisory_lock" }
# The vendored TigerBeetle AOF (item21): the standby's commit/heartbeat
# stream rides the real TB-format write-behind log through its Zig C ABI.
lunet-locks-aof = { path = "../../ext/lunet-locks-aof" }
# The bridge (item23) decodes Wire records through the core's own
# `Message::unpack_from`; the [patch] below resolves it to the submodule.
vrr = { package = "vrr-core", git = "https://github.com/lua-lunet/uvrr-core.git", tag = "v0.9.0" }
serde_json = "1"
# The run-state snapshot archives (the snapshot rule): the check tool
# reads `snapshot_run.lua`'s gzip tars transparently next to raw run dirs.
tar = "0.4"
flate2 = "1"
signal-hook = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# The phi-accrual embed (item19): the crate and its executor ride the
# `experimental-phi` feature only — a normal (default) build compiles out
# the dependency, the detector, the sketches, and the wire trailer
# entirely; the normal path runs the sloppy leader timeout (phi.rs).
chrono = { version = "0.4", optional = true }
phi-accrual-detector = { version = "0.3.1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[features]
default = []
experimental-phi = ["dep:chrono", "dep:phi-accrual-detector", "dep:tokio"]
# The Flight Recorder passthrough: the rig binary with the per-node
# internal trace compiled in (the run's swap-in build —
# `cargo build --release --features flight-recorder`). The recorded
# nodes opt in per node via `LUNET_FLIGHT_RECORDER_DIR`.
flight-recorder = ["lunet-advisory-lock/flight-recorder"]

# The [patch] section is honored only in a workspace root's manifest — a
# dependency's own [patch] is ignored — so the consumer restates it here.
# It resolves the tagged dependency to the vendored submodule copy
# (ext/uvrr-core, checked out at b2ba0d2 = upstream tag v0.9.0), so every
# build lane — including Docker with no network fetch — builds against
# content byte-identical to the released tag.
[patch."https://github.com/lua-lunet/uvrr-core.git"]
vrr-core = { path = "../../ext/uvrr-core" }

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
