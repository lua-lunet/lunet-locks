[project]
docs_dir = "src"
site_name = "lunet-locks"
site_description = "Lightweight advisory locking service using expiring leases and Viewstamped Replication on lunet."
site_author = "Simon Massey"

nav = [
  { "Overview" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "External client protocol" = "client-protocol.md" },
  { "Build and tests" = "build-and-tests.md" },
]

site_url = "https://simbo1905.github.io/lunet-locks/"
repo_url = "https://github.com/simbo1905/lunet-locks"
repo_name = "simbo1905/lunet-locks"

copyright = """
Copyright &copy; 2026 Simon Massey
"""

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
