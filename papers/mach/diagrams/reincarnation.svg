<text x="445" y="1327.50" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">{A,B})</text>
<line x1="435" y1="1316" x2="767.24" y2="1399.06" stroke="#111111" stroke-width="1.3" stroke-dasharray="6 4"/>
<polygon points="775,1401 765.30,1402.70 767.24,1394.94" fill="#111111"/>
<text x="785" y="1397.50" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">11 standby stream (D now</text>
<text x="785" y="1412.50" font-size="15" fill="#111111" text-anchor="start" font-weight="bold">weight 1)</text>
