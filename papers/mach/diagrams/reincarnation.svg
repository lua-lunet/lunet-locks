<svg xmlns="http://www.w3.org/2000/svg" width="975" height="1447" viewBox="0 0 975 1447" font-family="Times New Roman, Times, serif">
<rect width="975" height="1447" fill="#ffffff"/>
<line x1="257" y1="557" x2="783" y2="557" stroke="#111111" stroke-width="1.2" stroke-dasharray="9 6"/>
<text x="251" y="573" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">Era 1 — crossing batch</text>
<text x="251" y="588" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">DECREMENT(C)+JOIN(D):</text>
<text x="251" y="603" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">weights (A,B,C,D) =</text>
<text x="251" y="618" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">(1,1,0,0); D joins at weight</text>
<text x="251" y="633" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">0 (standby); forming quorum</text>
<text x="251" y="648" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">{A,B} = mass 2 of total 2</text>
<line x1="257" y1="956" x2="783" y2="956" stroke="#111111" stroke-width="1.2" stroke-dasharray="9 6"/>
<text x="251" y="972" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">Era 2 —</text>
<text x="251" y="987" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">INCREMENT(D)+LEAVE(C):</text>
<text x="251" y="1002" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">weights (A,B,D) = (1,1,1); D</text>
<text x="251" y="1017" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">promoted 0→1, C leaves at</text>
<text x="251" y="1032" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">weight 0; forming quorum</text>
<text x="251" y="1047" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">{A,B} = mass 2 of total 3 —</text>
<text x="251" y="1062" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">the same set as era 1, so</text>
<text x="251" y="1077" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">the quorums coincide and</text>
<text x="251" y="1092" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">leader B carries both eras</text>
<text x="251" y="1107" font-size="14" fill="#111111" text-anchor="end" font-weight="normal">without a pivot</text>
