name: CI

# Lane split modeled on the upstream lua-lunet/lunet build workflow: a
# setup-matrix job decides the matrix per event. Regular builds (PRs, pushes
# to main) run the fast Linux-only lane; tagged builds (v*) run the full
# platform matrix, package per-platform release archives, and then run the
# Docker simulation before publish-release creates the GitHub release.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write # publish-release creates GitHub releases on v* tags

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          # Regular lane: Linux amd64 + arm64 only (the fast stuff).
          LINUX='{"include":[{"os":"ubuntu-24.04","arch":"amd64","platform":"linux","target_key":"linux-amd64"},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"}]}'
          # Tagged lane: everything, adding macOS and Windows.
          ALL='{"include":[{"os":"ubuntu-24.04","arch":"amd64","platform":"linux","target_key":"linux-amd64"},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","arch":"arm64","platform":"linux","target_key":"linux-arm64"},{"os":"macos-latest","arch":"arm64","platform":"macos","target_key":"macos"},{"os":"blacksmith-4vcpu-windows-2025","arch":"amd64","platform":"windows","target_key":"windows"}]}'
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$LINUX" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.target_key }}
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit libluajit-5.1-dev luarocks perl
          # Debian's luarocks package pulls in PUC lua5.1 and then detects it
          # before luajit, so rock wrappers would exec PUC Lua, which lacks
          # LuaJIT's built-in `bit` module the tests require. A shim prefix
          # whose only interpreter is luajit pins wrappers and headers to
          # LuaJIT; pass LUAJIT_DIR=/opt/luajit-shim to every make invocation.
          sudo mkdir -p /opt/luajit-shim/bin
          sudo ln -sf /usr/bin/luajit /opt/luajit-shim/bin/lua
          sudo ln -sf /usr/bin/luajit /opt/luajit-shim/bin/luajit
          sudo ln -sfn /usr/include /opt/luajit-shim/include
          sudo ln -sfn /usr/lib /opt/luajit-shim/lib
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        # zlib: the official lunet-run macOS release binary is dynamically
        # linked against Homebrew's libz (dyld: "Library not loaded:
        # /opt/homebrew/opt/zlib/lib/libz.1.dylib") on the runner it was
        # built on; GitHub's macos-latest image does not have the zlib
        # formula installed by default.
        run: brew install luajit luarocks zlib
      - uses: jdx/mise-action@v2
        if: runner.os != 'Windows'
      # rustfmt + clippy are required by make ext-check (cargo fmt --check,
      # cargo clippy); the default rust-toolchain profile omits them.
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - name: Install project Lua tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            make deps LUAJIT_DIR=/opt/luajit-shim
          else
            make deps
          fi
      - name: Format and lint
        if: runner.os != 'Windows'
        run: make fmt && git diff --exit-code && make lint
      - name: Rust, Cyan, and advisory tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            make test LUAJIT_DIR=/opt/luajit-shim
          else
            make test
          fi
      - name: Three-replica Lunet smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            make smoke LUAJIT_DIR=/opt/luajit-shim
          else
            make smoke
          fi
      - name: Build documentation
        if: matrix.target_key == 'linux-amd64'
        run: make docs
      # Tagged builds only: package the per-platform release archive from the
      # tree that just passed test + smoke, for publish-release to attach.
      # Windows is excluded: the Lua loader has no .dll suffix handling, so
      # there is no loadable Windows artifact to ship (see the reduced-scope
      # Windows step below).
      - name: Package release archive
        if: github.ref_type == 'tag' && matrix.platform != 'windows'
        shell: bash
        run: tests/package_release.sh ${{ matrix.target_key }} lunet-locks-${{ matrix.target_key }}.tar.gz
      - name: Upload release archive
        if: github.ref_type == 'tag' && matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_key }}
          path: lunet-locks-${{ matrix.target_key }}.tar.gz
          retention-days: 5
      # Windows lane, tagged builds only: reduced scope. The Teal/Cyan
      # toolchain, the shell smoke harness, and the Docker simulation are
      # POSIX-only today; validate the Rust extension crate natively.
      - name: Rust extension tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path ext/advisory_lock/Cargo.toml

  # Tagged builds only: the docker/* simulation against a release build of
  # the native adapter, on both Linux architectures.
  docker-simulation:
    name: Docker simulation (${{ matrix.target_key }})
    if: github.ref_type == 'tag'
    needs: [setup-matrix, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: linux
            target_key: linux-amd64
          - os: blacksmith-4vcpu-ubuntu-2404-arm
            arch: arm64
            platform: linux
            target_key: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit libluajit-5.1-dev luarocks perl
          # LuaJIT shim prefix; see the test job for why this exists.
          sudo mkdir -p /opt/luajit-shim/bin
          sudo ln -sf /usr/bin/luajit /opt/luajit-shim/bin/lua
          sudo ln -sf /usr/bin/luajit /opt/luajit-shim/bin/luajit
          sudo ln -sfn /usr/include /opt/luajit-shim/include
          sudo ln -sfn /usr/lib /opt/luajit-shim/lib
      - uses: jdx/mise-action@v2
      # rustfmt + clippy are required by make ext-check (cargo fmt --check,
      # cargo clippy); the default rust-toolchain profile omits them.
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - name: Install project Lua tools
        run: make deps LUAJIT_DIR=/opt/luajit-shim
      - name: Docker build and three-container simulation
        run: make docker-simulation LUAJIT_DIR=/opt/luajit-shim

  # Tagged builds only, modeled on upstream lua-lunet/lunet's publish-release:
  # runs after every verification lane passed, downloads the packaged
  # release-* artifacts, and creates the GitHub release with all three
  # platform archives attached.
  publish-release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [test, docker-simulation]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify expected archives
        run: |
          set -euo pipefail
          ls -la release-assets
          for target in linux-amd64 linux-arm64 macos; do
            test -f "release-assets/lunet-locks-$target.tar.gz" || {
              echo "missing release asset: lunet-locks-$target.tar.gz" >&2
              exit 1
            }
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/lunet-locks-linux-amd64.tar.gz
            release-assets/lunet-locks-linux-arm64.tar.gz
            release-assets/lunet-locks-macos.tar.gz
