name: Publish tbio-core AOF artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tbio-core.yml
      - .gitmodules
      - ext/lunet-locks-aof

permissions:
  contents: read
  packages: write

env:
  AOF_TAG: v0.17.9-lunet.2
  IMAGE: ghcr.io/simbo1905/tbio-core

jobs:
  build:
    name: AOF ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            zig_target: x86_64-linux-gnu
            zig_cpu: baseline+aes+avx
          - arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
            zig_target: aarch64-linux-gnu
            zig_cpu: baseline+aes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Verify the pinned AOF tag
        run: test "$(git -C ext/lunet-locks-aof describe --tags --exact-match)" = "$AOF_TAG"
      - name: Build the AOF natively
        working-directory: ext/lunet-locks-aof/zig
        run: mise exec -- zig build -Dtarget="${{ matrix.zig_target }}" -Dcpu="${{ matrix.zig_cpu }}" -Doptimize=ReleaseSafe
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the architecture artifact
        run: |
          image="$IMAGE:$AOF_TAG-${{ matrix.arch }}"
          DOCKER_BUILDKIT=0 docker build \
            -f "$GITHUB_WORKSPACE/docker/Dockerfile.tbio-core" \
            -t "$image" "$GITHUB_WORKSPACE/ext/lunet-locks-aof/zig"
          docker push "$image"

  manifest:
    name: Publish AOF manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture tag
        run: |
          docker manifest create "$IMAGE:$AOF_TAG" \
            "$IMAGE:$AOF_TAG-amd64" \
            "$IMAGE:$AOF_TAG-arm64"
          docker manifest push "$IMAGE:$AOF_TAG"
