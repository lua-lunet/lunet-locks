[package]
name = "lunet-advisory-lock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "lunet_advisory_lock"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
vrr = { package = "vrr-core", git = "https://github.com/lua-lunet/uvrr-core.git", rev = "0fc6380aa36f45c92b3b7c8df679d7f7991803aa" } # commit 0fc6380, upstream main at time of bump

# The §10 learner-era-fold patch branch: the submodule under ext/uvrr-core
# carries the upstream commit plus the learner acquisition rule, so the
# demo's joined learner converges. See ext/uvrr-core's branch
# lunet-locks/learner-era-fold and the drafted upstream issue.
[patch."https://github.com/lua-lunet/uvrr-core.git"]
vrr-core = { path = "../uvrr-core" }

[features]
default = ["io-uring"]
# Linux appends go through an io_uring ring (page-cached buffered writes;
# no O_DIRECT/O_SYNC). On non-Linux targets the feature is inert and the
# writer thread uses plain buffered write_all.
io-uring = ["dep:io-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[dev-dependencies]
proptest = "1.11.0"
