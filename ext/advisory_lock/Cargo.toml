[package]
name = "lunet-advisory-lock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "lunet_advisory_lock"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
vrr = { package = "vrr-core", git = "https://github.com/lua-lunet/vrr-core.git", rev = "6cbc1f36fb3a8bfa3aa7a66d12d697d3539b8ff0" } # tag v0.2.0

[dev-dependencies]
proptest = "1.11.0"
