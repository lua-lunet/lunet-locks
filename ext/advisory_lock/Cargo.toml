[package]
name = "lunet-advisory-lock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "lunet_advisory_lock"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
vrr = { package = "vrr-core", git = "https://github.com/lua-lunet/uvrr-core.git", rev = "0fc6380aa36f45c92b3b7c8df679d7f7991803aa" } # commit 0fc6380, upstream main at time of bump

[dev-dependencies]
proptest = "1.11.0"
